<!-- ======================================
   👑 CROWN TRANSFERS – SERVICE ANFRAGE
====================================== -->

<section class="ct-service-request" id="service-request">
  <div class="ct-sr-wrap">

    <h1>Service Anfrage</h1>
    <p class="ct-sr-sub">Stellen Sie eine Anfrage für einen unserer professionellen Chauffeurservices.</p>

    <form action="https://formsubmit.co/devanantham.saranjan@gmail.com" method="POST" class="ct-sr-form">

      <!-- Name -->
      <div class="ct-row">
        <label>Ihr Name*</label>
        <input type="text" name="name" required placeholder="Vor- und Nachname">
      </div>

      <!-- E-Mail -->
      <div class="ct-row">
        <label>E-Mail*</label>
        <input type="email" name="email" required placeholder="name@example.com">
      </div>

      <!-- Telefon -->
      <div class="ct-row">
        <label>Telefon (optional)</label>
        <input type="tel" name="phone" placeholder="+41 …">
      </div>

      <!-- Service Auswahl (DEINE SERVICES) -->
      <div class="ct-row">
        <label>Service auswählen*</label>
        <select name="service" required>
          <option value="">Bitte auswählen…</option>
          <option>Hotel & Flughafen Transfers</option>
          <option>WEF Davos 2027 Shuttle</option>
          <option>Business & VIP Chauffeurservice</option>
          <option>Event- & Gruppenfahrten</option>
          <option>Ski Resort Transfers</option>
          <option>Exklusive Sightseeing-Touren</option>
        </select>
      </div>

      <!-- Pick-up -->
      <div class="ct-row">
        <label>Abholort*</label>
        <input type="text" name="pickup" required placeholder="Zürich Flughafen, Hotel, Adresse…">
      </div>

      <!-- Drop-off -->
      <div class="ct-row">
        <label>Zielort*</label>
        <input type="text" name="dropoff" required placeholder="Adresse oder Ort…">
      </div>

      <!-- Datum -->
      <div class="ct-row">
        <label>Datum*</label>
        <input type="date" name="date" required>
      </div>

      <!-- Uhrzeit -->
      <div class="ct-row">
        <label>Uhrzeit*</label>
        <input type="time" name="time" required>
      </div>

      <!-- Nachricht -->
      <div class="ct-row">
        <label>Nachricht / Details*</label>
        <textarea name="message" required rows="5" placeholder="Flugnummer, Anzahl Personen, Gepäck, Wünsche…"></textarea>
      </div>

      <!-- Button -->
      <button type="submit" class="ct-sr-btn">Anfrage senden</button>

      <!-- FormSubmit Fix -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

    </form>
  </div>
</section>
