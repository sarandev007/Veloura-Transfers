<!-- ======================================
   👑 كراون ترانسفيرز – طلب خدمة
====================================== -->

<section class="ct-service-request" id="service-request" dir="rtl">
  <div class="ct-sr-wrap">

    <h1>طلب خدمة</h1>
    <p class="ct-sr-sub">أرسل طلبك للحصول على إحدى خدمات السائقين المحترفين لدينا.</p>

    <form action="https://formsubmit.co/devanantham.saranjan@gmail.com" method="POST" class="ct-sr-form">

      <!-- Name -->
      <div class="ct-row">
        <label>الاسم الكامل*</label>
        <input type="text" name="name" required placeholder="الاسم الأول واسم العائلة">
      </div>

      <!-- Email -->
      <div class="ct-row">
        <label>البريد الإلكتروني*</label>
        <input type="email" name="email" required placeholder="name@example.com">
      </div>

      <!-- Phone -->
      <div class="ct-row">
        <label>رقم الهاتف (اختياري)</label>
        <input type="tel" name="phone" placeholder="+41 …">
      </div>

      <!-- Service Selection -->
      <div class="ct-row">
        <label>اختيار الخدمة*</label>
        <select name="service" required>
          <option value="">يرجى الاختيار…</option>
          <option>خدمة التوصيل من وإلى الفندق والمطار</option>
          <option>خدمة النقل لمؤتمر دافوس 2026</option>
          <option>خدمة سائق خاص لكبار الشخصيات ورجال الأعمال</option>
          <option>النقل للمناسبات والمجموعات</option>
          <option>نقل إلى منتجعات التزلج</option>
          <option>جولات سياحية فاخرة</option>
        </select>
      </div>

      <!-- Pick-up -->
      <div class="ct-row">
        <label>مكان الانطلاق*</label>
        <input type="text" name="pickup" required placeholder="مطار زيورخ، الفندق، العنوان…">
      </div>

      <!-- Drop-off -->
      <div class="ct-row">
        <label>الوجهة*</label>
        <input type="text" name="dropoff" required placeholder="العنوان أو الوجهة…">
      </div>

      <!-- Date -->
      <div class="ct-row">
        <label>التاريخ*</label>
        <input type="date" name="date" required>
      </div>

      <!-- Time -->
      <div class="ct-row">
        <label>الوقت*</label>
        <input type="time" name="time" required>
      </div>

      <!-- Message -->
      <div class="ct-row">
        <label>الرسالة / التفاصيل*</label>
        <textarea name="message" required rows="5" placeholder="رقم الرحلة، عدد الركاب، الأمتعة، الملاحظات…"></textarea>
      </div>

      <!-- Button -->
      <button type="submit" class="ct-sr-btn">إرسال الطلب</button>

      <!-- FormSubmit Fix -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

    </form>
  </div>
</section>
